name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download Whisper-tiny fp16 model
        run: |
          mkdir -p public/whisper/Xenova/whisper-tiny/onnx
          cd public/whisper/Xenova/whisper-tiny
          for f in tokenizer.json tokenizer_config.json config.json generation_config.json preprocessor_config.json; do
            curl -fsSL -o "$f" "https://huggingface.co/Xenova/whisper-tiny/resolve/main/$f"
          done
          for f in encoder_model_fp16.onnx decoder_model_merged_fp16.onnx decoder_model_fp16.onnx decoder_with_past_model_fp16.onnx; do
            curl -fsSL -o "onnx/$f" "https://huggingface.co/Xenova/whisper-tiny/resolve/main/onnx/$f"
          done
          du -sh .

      - run: npm run build

      - run: touch ./out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
